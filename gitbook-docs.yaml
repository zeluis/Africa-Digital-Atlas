$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Africa Digital Atlas Docs
  structure:
    - type: section
      key: section-1
      title: Home
      path: home
      icon: house
      default: true
      children:
        - type: space
          key: space-1
          title: Home
          path: home
          default: true
          content:
            directory: ./home/home
    - type: section
      key: section-2
      title: User Guide
      path: documentation
      icon: book-open
      children:
        - type: space
          key: space-2
          title: Documentation
          path: documentation
          default: true
          content:
            directory: ./documentation/documentation
    - type: section
      key: section-3
      title: Data & Methodology
      path: api-reference
      icon: database
      children:
        - type: space
          key: space-3
          title: API Reference
          path: api-reference
          default: true
          content:
            directory: ./api-reference/api-reference
    - type: section
      key: section-4
      title: Developer Guide
      path: changelog
      icon: code
      children:
        - type: space
          key: space-4
          title: Changelog
          path: changelog
          default: true
          content:
            directory: ./changelog/changelog
    - type: section
      key: section-5
      title: FAQ
      path: help-center
      icon: circle-question
      children:
        - type: space
          key: space-5
          title: Help Center
          path: help-center
          default: true
          content:
            directory: ./help-center/help-center
