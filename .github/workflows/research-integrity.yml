name: Research & Provenance Integrity Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-integrity:
    name: Verify Provenance, Checksums & Editorial Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run Research Rules & Warning Ratchet Check
        run: npm run research:check

      - name: Run Deep Dataset Checksum & Status Flag Integrity Check
        run: npm run research:integrity

      - name: Run TypeScript Typecheck
        run: npm run lint
