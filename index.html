<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afriata: Africa Data Atlas</title>
    <meta name="description" content="An interactive atlas of geography, curated socioeconomic indicators (2015–2024), and historical trade flows covering all 54 sovereign African nations across 8 thematic pillars, with SlaveVoyages trans-Atlantic summary data (1514–1866) and ethnic tree cartography." />
    <meta name="theme-color" content="#4e5e51" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Afriata" />
    
    <meta name="afriata-base" content="%BASE_URL%" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="alternate icon" type="image/png" href="%BASE_URL%favicon-32x32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('atlas_theme');
          var theme = saved === 'dark' ? 'dark' : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <meta property="og:title" content="Afriata: Africa Data Atlas" />
    <meta property="og:description" content="An interactive atlas of geography, curated socioeconomic indicators (2015–2024), and historical trade flows covering all 54 sovereign African nations across 8 thematic pillars, with SlaveVoyages trans-Atlantic summary data (1514–1866) and ethnic tree cartography." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
