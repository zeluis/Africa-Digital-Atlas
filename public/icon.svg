<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="africaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#rimGrad)" stroke-width="6" opacity="0.65" />

  <!-- Geodetic Coordinate Grid Arcs -->
  <g opacity="0.18" stroke="#6ee7b7" stroke-width="2" fill="none">
    <!-- Concentric radar circles -->
    <circle cx="256" cy="256" r="80" stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="140" stroke-dasharray="4 6" />
    <circle cx="256" cy="256" r="195" />
    <!-- Lat/Long Meridian lines -->
    <line x1="256" y1="48" x2="256" y2="464" stroke-dasharray="8 6" />
    <line x1="48" y1="256" x2="464" y2="256" stroke-dasharray="8 6" />
    <ellipse cx="256" cy="256" rx="170" ry="110" stroke-dasharray="5 7" />
  </g>

  <!-- Stylized African Continent Silhouette with Geometric Precision -->
  <g filter="url(#softShadow)" transform="translate(18, -6)">
    <!-- Main African Continent Vector Path (Carefully Scaled & Centered) -->
    <path
      d="M175,115
         C195,108 240,105 270,112
         C290,118 315,120 330,135
         C345,150 365,170 380,185
         C388,193 400,205 405,220
         C402,230 385,245 365,250
         C350,254 340,265 335,280
         C330,295 332,315 330,335
         C328,355 315,385 295,410
         C280,430 260,452 248,460
         C242,460 238,450 230,430
         C222,410 205,385 195,360
         C188,340 180,325 168,310
         C158,295 145,285 142,270
         C138,255 125,245 105,235
         C90,225 80,215 82,195
         C85,175 105,155 130,140
         C150,128 165,120 175,115 Z"
      fill="url(#africaGrad)"
      stroke="#a7f3d0"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <!-- Madagascar -->
    <path
      d="M362,345
         C370,335 378,350 376,375
         C374,400 366,420 358,425
         C352,425 350,410 352,390
         C354,370 356,355 362,345 Z"
      fill="url(#africaGrad)"
      stroke="#a7f3d0"
      stroke-width="3"
    />

    <!-- Cabo Verde & Oceanic Islands Data Blips -->
    <circle cx="64" cy="205" r="7" fill="#6ee7b7" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
    <circle cx="64" cy="205" r="14" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="340" cy="290" r="5" fill="#a7f3d0" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="395" cy="355" r="5" fill="#a7f3d0" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Network Constellation & Strategic Data Nodes across Africa -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.85">
    <!-- Connecting constellation vectors -->
    <line x1="205" y1="135" x2="280" y2="135" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="280" y1="135" x2="350" y2="200" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="130" y1="185" x2="235" y2="245" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="235" y1="245" x2="350" y2="200" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="235" y1="245" x2="320" y2="305" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="235" y1="245" x2="255" y2="395" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="320" y1="305" x2="255" y2="395" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="320" y1="305" x2="368" y2="385" opacity="0.6" stroke-dasharray="4 4" />
  </g>

  <!-- Data Hub Nodes (Glowing Pulses) -->
  <!-- Cairo / North Hub -->
  <circle cx="298" cy="129" r="7" fill="#ffffff" filter="url(#glow)" />
  <circle cx="298" cy="129" r="4" fill="#10b981" />
  <!-- Lagos / West Hub -->
  <circle cx="148" cy="179" r="7" fill="#ffffff" filter="url(#glow)" />
  <circle cx="148" cy="179" r="4" fill="#10b981" />
  <!-- Addis Ababa / Horn Hub -->
  <circle cx="368" cy="194" r="8" fill="#ffffff" filter="url(#glow)" />
  <circle cx="368" cy="194" r="5" fill="#06b6d4" />
  <!-- Kinshasa / Central Hub -->
  <circle cx="253" cy="239" r="7" fill="#ffffff" filter="url(#glow)" />
  <circle cx="253" cy="239" r="4" fill="#10b981" />
  <!-- Nairobi / East Hub -->
  <circle cx="338" cy="299" r="7" fill="#ffffff" filter="url(#glow)" />
  <circle cx="338" cy="299" r="4" fill="#10b981" />
  <!-- Johannesburg / South Hub -->
  <circle cx="273" cy="389" r="8" fill="#ffffff" filter="url(#glow)" />
  <circle cx="273" cy="389" r="5" fill="#3b82f6" />

  <!-- Subtle Atlas Brand Accent Text / Shield -->
  <g transform="translate(256, 480)" text-anchor="middle">
    <rect x="-70" y="-22" width="140" height="20" rx="10" fill="#042f2e" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
    <text y="-8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#6ee7b7" letter-spacing="2.5">AFRICA ATLAS</text>
  </g>
</svg>